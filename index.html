<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarmeez</title>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <script src="node_modules/axios/dist/axios.min.js"></script>
    <style>
      body {
        background-color: #f0ecff;
      }
      .card:not(:first-child) {
        margin-top: 30px;
      }
      #add-btn {
        bottom: 5%;
        right: 7%;
        height: 70px;
        width: 70px;
        font-size: 50px;
        color: white;
        border-radius: 50%;
        text-align: center;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.3);
      }

      /* START LOADER STYLES */
      .lds-roller,
      .lds-roller div,
      .lds-roller div:after {
        box-sizing: border-box;
      }
      .lds-roller {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
      }
      .lds-roller div {
        animation: lds-roller 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        transform-origin: 40px 40px;
      }
      .lds-roller div:after {
        content: " ";
        display: block;
        position: absolute;
        width: 7.2px;
        height: 7.2px;
        border-radius: 50%;
        background: white;
        margin: -3.6px 0 0 -3.6px;
      }
      .lds-roller div:nth-child(1) {
        animation-delay: -0.036s;
      }
      .lds-roller div:nth-child(1):after {
        top: 62.62742px;
        left: 62.62742px;
      }
      .lds-roller div:nth-child(2) {
        animation-delay: -0.072s;
      }
      .lds-roller div:nth-child(2):after {
        top: 67.71281px;
        left: 56px;
      }
      .lds-roller div:nth-child(3) {
        animation-delay: -0.108s;
      }
      .lds-roller div:nth-child(3):after {
        top: 70.90963px;
        left: 48.28221px;
      }
      .lds-roller div:nth-child(4) {
        animation-delay: -0.144s;
      }
      .lds-roller div:nth-child(4):after {
        top: 72px;
        left: 40px;
      }
      .lds-roller div:nth-child(5) {
        animation-delay: -0.18s;
      }
      .lds-roller div:nth-child(5):after {
        top: 70.90963px;
        left: 31.71779px;
      }
      .lds-roller div:nth-child(6) {
        animation-delay: -0.216s;
      }
      .lds-roller div:nth-child(6):after {
        top: 67.71281px;
        left: 24px;
      }
      .lds-roller div:nth-child(7) {
        animation-delay: -0.252s;
      }
      .lds-roller div:nth-child(7):after {
        top: 62.62742px;
        left: 17.37258px;
      }
      .lds-roller div:nth-child(8) {
        animation-delay: -0.288s;
      }
      .lds-roller div:nth-child(8):after {
        top: 56px;
        left: 12.28719px;
      }
      @keyframes lds-roller {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      /* END LOADER STYLES */
    </style>
  </head>
  <body>
    <!-- START LOADER -->
    <div
      id="loader"
      style="
        position: fixed;
        left: 0px;
        right: 0px;
        top: 0px;
        bottom: 0px;
        margin: auto auto;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        background-color: rgba(128, 128, 128, 0.493);
        width: 100px;
        height: 100px;
        border-radius: 20px;
        visibility: hidden;
      ">
      <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <!-- END LOADER -->
    <!-- START MODALS -->
    <!-- START LOGIN MODAL -->
    <div
      class="modal fade"
      id="login-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="username-input" class="col-form-label"
                  >Username:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="username-input"
                  value="khaled" />
              </div>
              <div class="mb-3">
                <label for="password-input" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="password-input"
                  value="123456" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal">
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginBtnClick()">
              Login
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- END LOGIN MODAL -->
    <!-- START REGISTER MODAL -->
    <div
      class="modal fade"
      id="register-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Register A New User
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="register-name-input" class="col-form-label"
                  >Name:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="register-name-input" />
              </div>
              <div class="mb-3">
                <label for="register-username-input" class="col-form-label"
                  >Username:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="register-username-input" />
              </div>
              <div class="mb-3">
                <label for="register-password-input" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="register-password-input" />
              </div>
              <div class="mb-3">
                <label for="register-image-input" class="col-form-label"
                  >Image:</label
                >
                <input
                  type="file"
                  class="form-control"
                  id="register-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal">
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="registerBtnClick()">
              Register
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- END REGISTER MODAL -->
    <!-- START CREATE POST MODAL -->
    <div
      class="modal fade"
      id="create-post-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="post-modal-title">
              Create A New Post
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="post-title-input" class="col-form-label"
                  >Title:</label
                >
                <input type="text" class="form-control" id="post-title-input" />

                <input type="hidden" id="post-id-input" value="" />
              </div>
              <div class="mb-3">
                <textarea
                  name=""
                  id="post-body-input"
                  class="w-100"
                  style="
                    height: 100px;
                    border-color: gray;
                    border-radius: 5px;
                    resize: none;
                  "></textarea>
              </div>
              <div class="mb-3">
                <label for="post-image-input" class="col-form-label"
                  >Image:</label
                >
                <input type="file" class="form-control" id="post-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal">
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="post-modal-submit-btn"
              onclick="createNewPost()">
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- END CREATE POST MODAL -->
    <!-- START DELETE POST MODAL -->
    <div
      class="modal fade"
      id="delete-post-modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="post-modal-title">
              Are You Sure You Want To Delete The Post?
              <span id="delete-post-title"></span>
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"></button>

            <input type="hidden" id="delete-post-id-input" value="" />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal">
              Close
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="post-modal-submit-btn"
              onclick="confirmPostDelete()">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- END DELETE POST MODAL -->
    <!-- END MODALS -->
    <!-- START ADD POST BUTTON -->
    <div
      class="bg-primary position-fixed"
      id="add-btn"
      onclick="addBtnClicked()">
      +
    </div>
    <!-- END ADD POST BUTTON -->
    <!-- START ALERTS -->
    <div
      id="alert"
      class="show fade"
      style="
        position: fixed;
        width: 30%;
        bottom: 0;
        right: 20px;
        z-index: 100;
      "></div>
    <!-- END ALERTS -->
    <!-- START NAV BAR CONT-->
    <div class="container">
      <div class="d-flex justify-content-center">
        <div class="col-9">
          <nav
            class="navbar navbar-expand-lg bg-body-tertiary shadow rounded pt-2">
            <div class="container-fluid">
              <a class="navbar-brand" href="index.html">Tarmeez</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a
                      class="nav-link active"
                      aria-current="page"
                      href="index.html"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link"
                      style="cursor: pointer"
                      onclick="profileClicked()"
                      >Profile</a
                    >
                  </li>
                </ul>
                <!-- START NON-LOGGED IN USER -->
                <div class="d-flex w-100 justify-content-end" id="login-div">
                  <button
                    type="button"
                    class="btn btn-outline-success mx-2"
                    data-bs-toggle="modal"
                    data-bs-target="#login-modal"
                    id="login-btn">
                    Login
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-success"
                    data-bs-toggle="modal"
                    data-bs-target="#register-modal"
                    id="register-btn">
                    Register
                  </button>
                </div>
                <!-- END NON-LOGGED IN USER -->
                <!-- START LOGGED IN USER -->
                <div
                  class="d-flex w-100 justify-content-end align-items-center"
                  id="logout-div">
                  <img
                    class="rounded-circle"
                    style="width: 40px; height: 40px"
                    id="nav-user-image"
                    src=""
                    alt="" />
                  <b id="nav-username"></b>
                  <button
                    type="button"
                    class="btn btn-outline-danger mx-2"
                    data-bs-toggle="modal"
                    id="logout-btn"
                    onclick="logout()">
                    Logout
                  </button>
                </div>
                <!-- END LOGGED IN USER -->
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>
    <!-- END NAV BAR CONT-->
    <!-- START MAIN CONTENT -->
    <div class="container">
      <!-- START POSTS -->
      <div class="d-flex justify-content-center mt-5">
        <div class="col-9">
          <div id="posts"></div>
        </div>
      </div>
      <!-- END POSTS -->
    </div>
    <!-- END MAIN CONTENT -->
    <script src="main.js"></script>
  </body>
</html>
